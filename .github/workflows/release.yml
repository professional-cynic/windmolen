# Publishes a release of the version in Cargo.toml (bump it and commit first):
#   - push a tag: git tag v0.2.0 && git push origin v0.2.0
#   - or press "Run workflow" on main in the Actions tab, which creates the tag.
#
# The release carries windmolen.exe and latest.txt (version + SHA-256),
# which the app's updater reads.
name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: write # create the release
  id-token: write # sign the build provenance
  attestations: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      # Pinned to a commit; persist-credentials: false keeps the token out of
      # .git/config, where later steps (build scripts included) could read it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Work out the version and tag
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(\d+\.\d+\.\d+)"$' | Select-Object -First 1).Matches[0].Groups[1].Value
          $tag = "v$version"
          if ($env:GITHUB_REF_TYPE -eq "tag") {
            if ($env:GITHUB_REF_NAME -ne $tag) { throw "Tag $env:GITHUB_REF_NAME does not match Cargo.toml version $version" }
          } else {
            # Started by hand: main only, and never a version released before.
            if ($env:GITHUB_REF -ne "refs/heads/main") { throw "Releases are made from main" }
            $refs = gh api "repos/$env:GITHUB_REPOSITORY/git/matching-refs/tags/$tag" --jq ".[].ref"
            if (@($refs) -contains "refs/tags/$tag") { throw "$tag is already tagged: bump the version in Cargo.toml first" }
          }
          "VERSION=$version" >> $env:GITHUB_ENV
          "TAG=$tag" >> $env:GITHUB_ENV

      - name: Update Rust
        run: rustup update stable --no-self-update

      - name: Locate the resource compiler (Explorer icon)
        shell: pwsh
        run: |
          $rc = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\rc.exe" | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $rc) { throw "rc.exe not found" }
          "RC=$($rc.FullName)" >> $env:GITHUB_ENV

      - name: Test
        run: cargo test --release --locked

      - name: Build
        run: cargo build --release --locked

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item target/release/windmolen.exe dist/
          $hash = (Get-FileHash dist/windmolen.exe -Algorithm SHA256).Hash.ToLower()
          [IO.File]::WriteAllText("dist/latest.txt", "$env:VERSION`n$hash`n")

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/windmolen.exe

      # A pushed tag already exists; started by hand, the release creates the
      # tag on the commit that was built.
      - name: Publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $at = if ($env:GITHUB_REF_TYPE -eq "tag") { "--verify-tag" } else { "--target=$env:GITHUB_SHA" }
          gh release create $env:TAG dist/windmolen.exe dist/latest.txt $at --generate-notes --title "Windmolen $env:VERSION"
